codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        # Allow up to 1% regression before failing PR
        target: auto
        threshold: 1%
    patch:
      default:
        # New code in PRs must have 80% coverage
        target: 80%
        only_pulls: true

comment:
  layout: condensed_header, files, condensed_footer
  require_changes: true
  require_base: true

flags:
  backend:
    paths:
      - backend/core/**
      - backend/src/**
      - backend/shared/**
      - backend/hosting/**
      - backend/seeding/**
      - backend/migrator-runtime/**
    carryforward: true
  frontend:
    paths:
      - frontend/src/**
      - frontend/contracts/**
    carryforward: true

ignore:
  # Backend — test projects, migrations, DI, plumbing
  - "backend/tests/**"
  - "backend/testsupport/**"
  - "backend/migrations-foundation/**"
  - "backend/migration-abstractions/**"
  # Pure-data options and constants only, listed by name. A file that holds logic
  # (RoleConstants.ParseRoleString, BffOptions.IsReturnToAllowed, KeycloakOptions,
  # TenantMiddlewareOptions, MigrationCliOptions, TenantSettings.ToEmailBranding) is
  # measured, so a new file is too.
  - "backend/seeding/SeedOptions.cs"
  - "backend/core/Configuration/IdentityProvisioningOptions.cs"
  - "backend/shared/TenantLifecycleConstants.cs"
  - "backend/shared/TimePolicyConstants.cs"
  - "backend/core/Constants/HeaderConstants.cs"
  - "backend/core/Constants/MembershipStatusConstants.cs"
  - "backend/core/Constants/SearchConstants.cs"
  - "backend/core/Constants/UserStatusConstants.cs"
  # Frontend — test infrastructure, type-only files, config
  - "frontend/src/**/*.test.*"
  - "frontend/src/**/*.spec.*"
  - "frontend/src/test-utils/**"
  - "frontend/src/**/*.d.ts"
  - "frontend/vite.config.*"
  - "frontend/eslint.config.*"
