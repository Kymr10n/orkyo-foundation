name: reusable / auto-bump

# Consumes `foundation_updated` (repository_dispatch, payload {version, channel}) in
# orkyo-saas and orkyo-community: pins the new foundation version with the caller's bump
# script and lands it without changing main untested (orkyo-saas#306).
#
#   stable  — branch foundation-bump/<version>, a pull request, auto-merge on green. Main
#             changes only after that PR's CI has passed. orkyo-infra's release.yml polls
#             the pin on main, so the release train simply waits for the merge.
#   nightly — the `nightly` branch, reset to main plus the prerelease pin and force-pushed.
#             The callers list `nightly` under on.push.branches, so CI runs against the
#             prerelease there and builds no images. Main never carries a prerelease pin.
#
# Both paths are idempotent. A redundant dispatch (release.yml re-sends stable once after
# a timeout) finds the open PR, or finds no diff, and changes nothing.
#
# `github.event.client_payload.{version,channel}` is read from the triggering event, which
# a reusable workflow shares with its caller — this job only runs when the caller's run
# was triggered by a `repository_dispatch` carrying that payload.
#
# COUPLING RULE: this is a `workflow_call` reusable workflow. It must never reference a
# local `./.github/actions/...` composite action — that breaks the CALLER with an
# undiagnosable startup_failure. Every third-party action below is pinned by SHA.
# Consumers pin their `uses:` to this file by commit SHA, never `@main`, and call with
# `secrets: inherit`.

on:
  workflow_call:
    inputs:
      bump-script-path:
        description: 'Path to the foundation-pin bump script, relative to repo root'
        required: false
        type: string
        default: 'scripts/bump-foundation.sh'
      committer-name:
        description: 'git user.name for the bump commit'
        required: false
        type: string
        default: 'github-actions[bot]'
      committer-email:
        description: 'git user.email for the bump commit'
        required: false
        type: string
        default: 'github-actions[bot]@users.noreply.github.com'
    secrets:
      GHCR_TOKEN:
        description: 'Checkout, branch push, PR and issue creation (a PAT, so the push triggers CI)'
        required: true
      AUTOMERGE_TOKEN:
        description: 'Enables auto-merge on the stable PR; the same fine-grained token dependabot-auto-merge.yml uses'
        required: true

jobs:
  auto-bump:
    name: Auto-bump Foundation (${{ github.event.client_payload.channel }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      FOUNDATION_VERSION: ${{ github.event.client_payload.version }}
      CHANNEL: ${{ github.event.client_payload.channel }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GHCR_TOKEN so the resulting push triggers CI (pushes made with
          # GITHUB_TOKEN do not, by design).
          token: ${{ secrets.GHCR_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure git
        run: |
          git config user.name "${{ inputs.committer-name }}"
          git config user.email "${{ inputs.committer-email }}"

      - name: Resolve the target branch
        id: target
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          case "${CHANNEL}" in
            stable)  branch="foundation-bump/${FOUNDATION_VERSION}" ;;
            nightly) branch="nightly" ;;
            *) echo "::error::unknown channel '${CHANNEL}' (expected stable or nightly)"; exit 1 ;;
          esac
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          pr=""
          if [[ "${CHANNEL}" == "stable" ]]; then
            pr=$(gh pr list --head "${branch}" --state open --json url --jq '.[0].url // ""')
          fi
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          if [[ -n "${pr}" ]]; then
            echo "Open PR for ${branch} already exists: ${pr}"
          fi

      - name: Bump foundation pin
        if: steps.target.outputs.pr == ''
        id: bump
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          # Always main plus this one change, whatever the branch held before.
          git checkout -B "${BRANCH}" origin/main
          ${{ inputs.bump-script-path }} "${FOUNDATION_VERSION}"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — foundation pin already at ${FOUNDATION_VERSION}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: bump foundation to ${FOUNDATION_VERSION} (${CHANNEL})"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push the nightly branch
        if: env.CHANNEL == 'nightly' && steps.bump.outputs.changed == 'true'
        run: git push --force origin "HEAD:refs/heads/${{ steps.target.outputs.branch }}"

      - name: Open the stable PR
        if: env.CHANNEL == 'stable' && steps.bump.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          # --force: a stale branch from an earlier, closed attempt must not block the push.
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          url=$(gh pr create --base main --head "${BRANCH}" \
            --title "chore: bump foundation to ${FOUNDATION_VERSION} (stable)" \
            --body "Opened by the release train (foundation_updated, channel stable). It merges on its own once the required checks pass; main is untouched until then. If a check fails, foundation ${FOUNDATION_VERSION} broke this product: fix forward on this branch, or close the PR and roll the release.")
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge on the stable PR
        if: env.CHANNEL == 'stable' && (steps.pr.outputs.url != '' || steps.target.outputs.pr != '')
        env:
          # The queued merge runs as whoever enabled it — see dependabot-auto-merge.yml for
          # why that is this token and not GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url || steps.target.outputs.pr }}
        run: |
          set -euo pipefail
          if [[ "$(gh pr view "${PR_URL}" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            echo "Auto-merge already enabled on ${PR_URL}"
            exit 0
          fi
          gh pr merge --auto --squash "${PR_URL}"

      - name: Create failure issue if auto-bump fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          TITLE="Auto-bump failed: foundation ${FOUNDATION_VERSION} (${CHANNEL})"
          BODY="The \`auto-bump\` job failed for foundation version \`${FOUNDATION_VERSION}\` on channel \`${CHANNEL}\`.

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check the run logs and re-trigger the bump manually if needed."
          EXISTING=$(gh issue list --state open --search "$TITLE" --json number --jq '.[0].number // ""')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "ci-failure"
          fi
