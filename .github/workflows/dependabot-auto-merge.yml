name: Dependabot auto-merge

# The job body lives in reusable-dependabot-auto-merge.yml — the same file the products
# call by SHA. What stays here is the trigger and the repo-specific deploy answer below.
#
# WHY pull_request_target AND NOT pull_request: pull_request_target evaluates this file
# from the base branch, so a pull request cannot change what runs with AUTOMERGE_TOKEN.
# The usual danger of that trigger is checking out and running untrusted pull-request
# code — this job checks out nothing and runs nothing from the pull request, so that risk
# is not present.
#
# THIS CANNOT DEPLOY. A merge to main here publishes nothing by itself: packages
# publish only from the nightly gate (schedule/dispatch) or a version tag, and
# consumers move only when a bump lands in their own repo.

on:
  pull_request_target:
    branches: [main]

permissions: {}

jobs:
  auto-merge:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-dependabot-auto-merge.yml
    secrets: inherit
