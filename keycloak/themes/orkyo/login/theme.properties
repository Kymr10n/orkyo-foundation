# Orkyo Login Theme
# Custom FreeMarker templates with minimal dark design

parent=base
import=common/keycloak

# Disable PatternFly — orkyo.css is a standalone stylesheet and PatternFly
# global rules (link colors, resets) interfere with our custom components.
stylesCommon=
styles=css/orkyo.css css/orkyo_extra.css

# Orkyo app URL for "Request access" link
# This is overridden by the client's baseUrl if available.
# Override at deploy time via KC_SPI_THEME_DEFAULT_orkyoAppUrl env var,
# or by setting the client's baseUrl in the Keycloak realm configuration.
orkyoAppUrl=https://orkyo.com

# Class mappings for base-theme templates that Orkyo does not override
# (webauthn-register.ftl, webauthn-authenticate.ftl, the passkeys.ftl macro
# and password-commons.ftl). The base markup reads these keys; mapping them
# to Orkyo classes makes those pages take the Orkyo styles.
kcFormClass=orkyo-form
kcFormGroupClass=orkyo-form-group
kcFormButtonsClass=orkyo-form-actions
kcFormOptionsClass=orkyo-form-options
kcFormOptionsWrapperClass=
kcButtonClass=orkyo-button
kcButtonPrimaryClass=orkyo-button-primary
kcButtonSecondaryClass=orkyo-button-secondary
kcButtonDefaultClass=orkyo-button-secondary
kcButtonBlockClass=orkyo-button-block
kcButtonLargeClass=
kcMarginTopClass=orkyo-mt
kcSelectAuthListItemClass=orkyo-authn-item
kcSelectAuthListItemIconClass=orkyo-authn-item-icon
kcSelectAuthListItemIconPropertyClass=
kcSelectAuthListItemBodyClass=orkyo-authn-item-body
kcSelectAuthListItemHeadingClass=orkyo-authn-item-heading
kcSelectAuthListItemDescriptionClass=orkyo-authn-item-description
kcSelectAuthListItemFillClass=
kcSelectAuthListItemTitle=orkyo-info-text
kcWebAuthnKeyIcon=
kcWebAuthnDefaultIcon=
