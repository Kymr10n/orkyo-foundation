# Orkyo Account Console
#
# A child of Keycloak's stock account console (keycloak.v3, shipped in
# keycloak-account-ui). The console is a React app we do not fork: this theme
# supplies branding only — logo, palette, typeface — and leaves structure and
# behaviour to the parent. That keeps Keycloak upgrades cheap.
#
# NOTE: keycloak.v2 has no account theme in Keycloak 26. Naming it is what made
# the console fall back to unbranded built-in Keycloak.
parent=keycloak.v3

# The parent honours the viewer's system preference; our palette covers both.
darkMode=true

# Masthead. environment.logo defaults to logo.svg in the parent; ours is a PNG,
# and the link sends people back to the product rather than to the console root.
logo=img/orkyo-logo.png
logoUrl=https://orkyo.com

title=Orkyo Account

# The leading slash is load-bearing: index.ftl builds the href as
# ${resourceUrl}${properties.favIcon}, with no separator (its own default is
# "/favicon.svg"). Without it the path collapses to ".../orkyoimg/...".
# The masthead logo above needs no slash — that one goes through a path join.
favIcon=/img/orkyo-logo.png
favIconType=image/png

# Loaded after the parent's own stylesheets, so these rules win.
styles=css/orkyo-account.css
